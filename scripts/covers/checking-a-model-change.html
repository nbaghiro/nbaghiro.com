<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What we check before changing an AI model</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}body{background:#e9ecea}.sheet{position:relative;width:100vw;height:100vh;overflow:hidden}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.21;filter:grayscale(1)}.wash{position:absolute;inset:0;background:linear-gradient(115deg,#e9eceaf0,#e9ecea55)}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:'Instrument Sans',sans-serif;fill:#283e37;font-size:18px}.serif{font-family:Newsreader,Georgia,serif}.mono{font-family:'JetBrains Mono',monospace;letter-spacing:1px;font-size:13px}.quiet{fill:#687d75}.line{stroke:#718a80;fill:none;stroke-width:1}.accent{stroke:#4e7872;fill:none;stroke-width:2}.box{fill:#f5f7f2a0;stroke:#82968c;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-callers.jpg" alt=""><div class="wash"></div><svg id="plate"></svg></div><script>
const data={"slug":"checking-a-model-change","title":"What we check before changing an AI model","product":"Galleo","coverTitle":["Before changing","an AI model"],"figures":[{"id":"model-comparison","title":"Keep the comparison identifiable","sub":"Proposed process around Galleo’s evaluation tooling","flow":false,"cards":[["Fixed task set","Same inputs and fixtures","Record prompt and tools"],["Baseline + candidate","Repeat important cases","Keep failed runs too"],["Inspect the results","Check the artifact and trace","Review rendered output"]],"note":"A prompt adaptation is a separate experiment from changing the model."},{"id":"model-release-gates","title":"Keep the outcomes separate","sub":"Review critical failures before aggregate scores","flow":false,"cards":[["Structure + scope","Valid content and tools","Unrelated content preserved"],["Task + quality","Requested result achieved","Supported, useful content"],["Latency + cost","Whole task including retries","Timeouts stay in the report"]],"note":"A better average does not resolve a critical editing regression."}],"post":"A model can produce a better first draft and still be less reliable at editing an existing document. We want to see both before changing what a product uses by default.\n\nIn Galleo, we have evaluation tooling for agent behavior and content generation, with deterministic checks alongside model-based judging.\n\nThe comparison we’d build around it uses fixed tasks, repeated runs and separate results for structure, task completion, unintended changes, visual quality, latency and cost.\n\nFor an editing task, we’d inspect the document and tool operations as well as the final response. Saying “Done” does not establish that the requested change happened or that unrelated content stayed intact.\n\nThe article covers the existing tooling and a proposed evaluation and rollout process, including how to preserve failed runs and keep a tested fallback:"};

data.figures[0].cards.forEach((card,i)=>{const x=left+i*(cw+gap);out+='<rect class="box" x="'+x+'" y="'+rowY+'" width="'+cw+'" height="'+(square?260:155)+'" rx="4"/><text class="mono quiet" x="'+(x+22)+'" y="'+(rowY+31)+'">0'+(i+1)+'</text><text class="serif" style="font-size:'+(square?25:29)+'px" x="'+(x+22)+'" y="'+(rowY+76)+'">'+card[0]+'</text>';card.slice(1).forEach((t,j)=>{out+='<text class="quiet" style="font-size:'+(square?15:18)+'px" x="'+(x+22)+'" y="'+(rowY+(square?170:108)+j*25)+'">'+t+'</text>'})});
const y=square?695:465;out+='<path class="accent" d="M'+left+' '+(y-25)+'H'+(square?920:1500)+'"/>';
let lines=[''];for(const word of data.figures[0].note.split(' ')){let i=lines.length-1;if(lines[i].length+word.length>(square?65:120))lines.push(word);else lines[i]+=(lines[i]?' ':'')+word}lines.forEach((line,i)=>{out+='<text class="quiet" x="'+left+'" y="'+(y+10+i*29)+'">'+line+'</text>'});
out+='<text class="mono quiet" x="'+left+'" y="'+(square?905:555)+'">NBAGHIRO.COM</text><path class="line" d="M'+left+' 38h-20v20M'+(square?920:1500)+' 38h20v20M'+left+' '+(square?950:580)+'h-20v-20M'+(square?920:1500)+' '+(square?950:580)+'h20v-20"/>';svg.innerHTML=out;
