<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>A comment that moves</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* The subject of the post: a note left on a phrase, words typed in front of it, and the
       note still on the same words. Over the same fog the rest of the site is photographed in,
       in the ink language of the post's figures. */
            * {
                margin: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: #e9ecea;
            }
            .sheet {
                position: relative;
                width: var(--w);
                height: var(--h);
                overflow: hidden;
                background: #dfe4e2;
            }
            .sheet img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 46%;
                filter: saturate(0.7) contrast(1);
            }
            .wash {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(233, 236, 234, 0.08) 0%,
                    rgba(233, 236, 234, 0.42) 30%,
                    rgba(233, 236, 234, 0.76) 58%,
                    rgba(233, 236, 234, 0.86) 100%
                );
            }
            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .ink {
                fill: none;
                stroke: #1b2522;
                stroke-width: 1.3;
            }
            .ink.thin {
                stroke-width: 1;
            }
            .mist {
                fill: none;
                stroke: #7e8d88;
                stroke-width: 1;
            }
            .mist.dash {
                stroke-dasharray: 5 4;
            }
            .water {
                fill: none;
                stroke: #4e7872;
                stroke-width: 1.4;
            }
            .fillbox {
                fill: rgba(27, 37, 34, 0.08);
                stroke: none;
            }
            .bar {
                fill: rgba(27, 37, 34, 0.17);
                stroke: none;
            }
            .bar.faint {
                fill: rgba(27, 37, 34, 0.09);
            }
            .land {
                fill: rgba(78, 120, 114, 0.2);
                stroke: none;
            }
            .tick {
                stroke: #46544f;
                stroke-width: 1.1;
            }
            text {
                font-family: "Instrument Sans", system-ui, sans-serif;
                font-size: 12px;
                fill: #68756f;
            }
            text.name {
                font-family: "Newsreader", Georgia, serif;
                font-size: 18px;
                fill: #1b2522;
            }
        </style>
    </head>
    <body>
        <div class="sheet">
            <img src="ph-anchor.jpg" alt="" />
            <div class="wash"></div>
            <svg preserveAspectRatio="none" id="plate"></svg>
        </div>
        <script>
            // A note is a chip in the margin joined to a range of words. Type in front of that
            // range and the chip keeps the same words, because the range was spliced by the same
            // amount the text moved.
            const S = document.getElementById("plate");
            const sheet = document.querySelector(".sheet");
            const [PW, PH] = (location.hash.slice(1) || "2000x769")
                .split("x")
                .map(Number);
            sheet.style.setProperty("--w", `${PW}px`);
            sheet.style.setProperty("--h", `${PH}px`);
            const wide = PW / PH > 2;
            const VB = wide ? [1000, 384] : [1000, 667];
            S.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
            const ns = "http://www.w3.org/2000/svg";
            const el = (name, attrs, text) => {
                const n = document.createElementNS(ns, name);
                for (const [k, v] of Object.entries(attrs))
                    n.setAttribute(k, v);
                if (text !== undefined) n.textContent = text;
                S.appendChild(n);
                return n;
            };
            const rect = (x, y, w, h, cls) =>
                el("rect", { x, y, width: w, height: h, class: cls });
            const path = (d, cls) => el("path", { d, class: cls });

            // One block of writing: four lines, with the second one broken into a run before the
            // marked phrase, the phrase itself, and a run after it.
            const block = (B, shift) => {
                rect(B.x, B.y, B.w, B.h, "fillbox");
                rect(B.x, B.y, B.w, B.h, "ink");
                const pad = 18;
                const left = B.x + pad;
                const right = B.x + B.w - pad;
                const pitch = 26;
                const top = B.y + 26;
                // lines one, three and four read as ordinary text
                for (const i of [0, 2, 3]) {
                    const w = i === 3 ? (right - left) * 0.56 : right - left;
                    rect(left, top + i * pitch, w, 9, "bar");
                }
                // line two: the run before the phrase, anything typed into it, then the phrase
                const y = top + pitch;
                const headW = 92;
                rect(left, y, headW, 9, "bar");
                if (shift) {
                    rect(left + headW + 8, y, shift - 8, 9, "bar faint");
                }
                const mx = left + headW + 8 + shift;
                const mw = 126;
                rect(mx - 5, y - 6, mw + 10, 21, "land");
                rect(mx, y, mw, 9, "bar");
                const tailX = mx + mw + 8;
                if (right - tailX > 16) rect(tailX, y, right - tailX, 9, "bar");
                // the range, drawn under the phrase the way the editor draws it
                const ry = y + 20;
                path(
                    `M${mx - 5} ${ry} H${mx + mw + 5} M${mx - 5} ${ry - 4} V${ry + 4} M${mx + mw + 5} ${ry - 4} V${ry + 4}`,
                    "water"
                );
                // the thread, out in the margin where the rail keeps it
                const C = { x: B.x + B.w + 22, y: y - 7, w: 40, h: 30 };
                path(`M${mx + mw + 5} ${ry} H${C.x}`, "mist dash");
                rect(C.x, C.y, C.w, C.h, "fillbox");
                rect(C.x, C.y, C.w, C.h, "ink thin");
                path(
                    `M${C.x + 10} ${C.y + 11} h18 M${C.x + 10} ${C.y + 19} h11`,
                    "water"
                );
                return { mx, mw, ry, C };
            };

            const A = wide
                ? { x: 60, y: 118, w: 330, h: 148 }
                : { x: 60, y: 150, w: 740, h: 164 };
            const Bb = wide
                ? { x: 548, y: 118, w: 330, h: 148 }
                : { x: 60, y: 404, w: 740, h: 164 };

            el("text", { x: A.x, y: A.y - 26, class: "name" }, "a note on a phrase");
            el("text", { x: A.x, y: A.y - 10 }, "the range the thread was written on");
            const a = block(A, 0);

            el("text", { x: Bb.x, y: Bb.y - 26, class: "name" }, "words typed in front of it");
            el("text", { x: Bb.x, y: Bb.y - 10 }, "the same words, further along the line");
            const b = block(Bb, 44);

            // how far the phrase moved, measured between the two blocks
            if (wide) {
                path(`M${A.x + A.w + 76} ${A.y + A.h / 2} H${Bb.x - 16}`, "water");
                path(
                    `M${Bb.x - 16} ${A.y + A.h / 2} l-7 -4 M${Bb.x - 16} ${A.y + A.h / 2} l-7 4`,
                    "water"
                );
            } else {
                const midY = A.y + A.h + 34;
                path(`M${A.x + 40} ${A.y + A.h + 16} V${Bb.y - 46}`, "water");
                path(
                    `M${A.x + 40} ${Bb.y - 46} l-4 -7 M${A.x + 40} ${Bb.y - 46} l4 -7`,
                    "water"
                );
                el(
                    "text",
                    { x: A.x + 56, y: midY + 4 },
                    "the mark is spliced by the same amount"
                );
            }

            // the measured rule, carrying the one sentence the cover has to say
            const ruleY = wide ? A.y + A.h + 44 : Bb.y + Bb.h + 34;
            const ruleW = wide ? Bb.x + Bb.w - A.x : A.w;
            path(`M${A.x} ${ruleY} H${A.x + ruleW}`, "tick");
            for (let i = 0; i <= 8; i += 1) {
                const x = A.x + (ruleW / 8) * i;
                path(`M${x} ${ruleY - (i % 4 === 0 ? 7 : 4)} V${ruleY}`, "tick");
            }
            el(
                "text",
                { x: A.x, y: ruleY + 18 },
                "the mark is invisible, so it rides the edit instead of being read back"
            );

            const R = 18;
            const Bm = VB[1] - 26;
            for (const [x, y, sx, sy] of [
                [30, 26, 1, 1],
                [970, 26, -1, 1],
                [30, Bm, 1, -1],
                [970, Bm, -1, -1],
            ]) {
                path(`M${x} ${y} h${R * sx}`, "ink thin");
                path(`M${x} ${y} v${R * sy}`, "ink thin");
            }
        </script>
    </body>
</html>
