<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What students can do after the help is removed</title><style>*{box-sizing:border-box;margin:0}html,body{background:#e9ecea}.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#e2e8e3}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.45)}.wash{position:absolute;inset:0;background:linear-gradient(140deg,rgba(235,239,233,.82),rgba(230,236,232,.93))}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:Georgia,serif;fill:#293d37}.quiet,.eyebrow{font-family:Arial,sans-serif;fill:#5c746c}.eyebrow{letter-spacing:3px;font-size:13px}.box{fill:#f6f7ef;fill-opacity:.68;stroke:#637b71;stroke-width:1.3}.boundary{fill:none;stroke:#9aafa5;stroke-width:1;stroke-dasharray:4 7}.line{fill:none;stroke:#526d62;stroke-width:1.8}.accent{fill:none;stroke:#437c70;stroke-width:2}.faint{fill:none;stroke:#81978b;stroke-width:1.4;opacity:.65}.dash{fill:none;stroke:#437c70;stroke-width:1.5;stroke-dasharray:5 5}.dot{fill:#437c70}.registration{fill:none;stroke:#8da196;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-map.jpg" alt=""><div class="wash"></div><svg id="plate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#437c70" stroke-width="1"/></marker></defs><g id="content"><text x="60" y="0" font-size="13" class="eyebrow" text-anchor="start">LEARNING</text><g transform="translate(0 35)"><rect x="100" y="35" width="300" height="190" rx="3" class="box"></rect><text x="122" y="77" font-size="25" class="label" text-anchor="start">Guided practice</text><text x="122" y="111" font-size="17" class="quiet" text-anchor="start">Assistance available</text><path d="M130 135 L290 135" class="faint"></path><path d="M130 150 L290 150" class="faint"></path><path d="M130 165 L290 165" class="faint"></path><path d="M130 180 L242.0 180" class="faint"></path><path d="M420 128 L520 128" class="accent" marker-end="url(#arrow)"></path><rect x="540" y="35" width="300" height="190" rx="3" class="box"></rect><text x="562" y="77" font-size="25" class="label" text-anchor="start">Independent work</text><text x="562" y="111" font-size="17" class="quiet" text-anchor="start">Help removed</text><rect x="570" y="130" width="60" height="45" rx="3" class="box"></rect><rect x="650" y="130" width="60" height="45" rx="3" class="box"></rect><path d="M720 152 L800 152" class="faint"></path><text x="470" y="278" font-size="25" class="label" text-anchor="middle">measure each outcome separately</text></g></g></svg></div><script>const [w,h]=(location.hash.slice(1)||'2000x769').split('x').map(Number);document.querySelector('.sheet').style.cssText=`--w:${w}px;--h:${h}px`;const wide=w/h>2;document.querySelector('svg').setAttribute('viewBox',`0 0 940 ${wide?384:627}`);document.getElementById('content').setAttribute('transform',`translate(0 ${wide?32:145})`);</script></body></html>
