<!doctype html><html lang="en"><head><meta charset="utf-8"><title>A weekly appointment across a clock change</title><style>*{box-sizing:border-box;margin:0}html,body{background:#e9ecea}.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#e2e8e3}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.45)}.wash{position:absolute;inset:0;background:linear-gradient(140deg,rgba(235,239,233,.82),rgba(230,236,232,.93))}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:Georgia,serif;fill:#293d37}.quiet,.eyebrow{font-family:Arial,sans-serif;fill:#5c746c}.eyebrow{letter-spacing:3px;font-size:13px}.box{fill:#f6f7ef;fill-opacity:.68;stroke:#637b71;stroke-width:1.3}.boundary{fill:none;stroke:#9aafa5;stroke-width:1;stroke-dasharray:4 7}.line{fill:none;stroke:#526d62;stroke-width:1.8}.accent{fill:none;stroke:#437c70;stroke-width:2}.faint{fill:none;stroke:#81978b;stroke-width:1.4;opacity:.65}.dash{fill:none;stroke:#437c70;stroke-width:1.5;stroke-dasharray:5 5}.dot{fill:#437c70}.registration{fill:none;stroke:#8da196;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-map.jpg" alt=""><div class="wash"></div><svg id="plate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#437c70" stroke-width="1"/></marker></defs><g id="content"><text x="60" y="0" font-size="13" class="eyebrow" text-anchor="start">SCHEDULING</text><g transform="translate(0 35)"><circle cx="195" cy="95" r="67" class="line"></circle><path d="M195 52 V95 H161" class="accent"></path><circle cx="195" cy="95" r="4" class="dot"></circle><text x="195" y="201" font-size="22" class="label" text-anchor="middle">Before the change</text><circle cx="725" cy="95" r="67" class="line"></circle><path d="M725 52 V95 H691" class="accent"></path><circle cx="725" cy="95" r="4" class="dot"></circle><text x="725" y="201" font-size="22" class="label" text-anchor="middle">After the change</text><path d="M290 95 L630 95" class="accent" marker-end="url(#arrow)"></path><text x="460" y="65" font-size="24" class="label" text-anchor="middle">same local time</text><text x="460" y="140" font-size="19" class="quiet" text-anchor="middle">time-zone rules</text><text x="460" y="251" font-size="26" class="label" text-anchor="middle">09:00 · one recurring appointment</text></g></g></svg></div><script>const [w,h]=(location.hash.slice(1)||'2000x769').split('x').map(Number);document.querySelector('.sheet').style.cssText=`--w:${w}px;--h:${h}px`;const wide=w/h>2;document.querySelector('svg').setAttribute('viewBox',`0 0 940 ${wide?384:627}`);document.getElementById('content').setAttribute('transform',`translate(0 ${wide?32:145})`);</script></body></html>
