<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What happens when an AI task is cancelled</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}body{background:#e9ecea}.sheet{position:relative;width:100vw;height:100vh;overflow:hidden}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.21;filter:grayscale(1)}.wash{position:absolute;inset:0;background:linear-gradient(115deg,#e9eceaf0,#e9ecea55)}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:'Instrument Sans',sans-serif;fill:#283e37;font-size:18px}.serif{font-family:Newsreader,Georgia,serif}.mono{font-family:'JetBrains Mono',monospace;letter-spacing:1px;font-size:13px}.quiet{fill:#687d75}.line{stroke:#718a80;fill:none;stroke-width:1}.accent{stroke:#4e7872;fill:none;stroke-width:2}.box{fill:#f5f7f2a0;stroke:#82968c;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-callers.jpg" alt=""><div class="wash"></div><svg id="plate"></svg></div><script>
const data={"slug":"cancelling-an-ai-task","title":"What happens when an AI task is cancelled","product":"FlowMaestro","coverTitle":["When an AI task","is cancelled"],"figures":[{"id":"cancel-states","title":"From request to confirmed outcome","sub":"Proposed cancellation contract","flow":true,"cards":[["Stop requested","Record the request","Show stopping"],["Worker acknowledges","Stop scheduling new steps","Handle in-flight work"],["Outcome recorded","Preserve completed effects","Settle known usage"]],"note":"Acknowledging a request does not confirm every effect has stopped."},{"id":"cancel-effects","title":"One run, three different outcomes","sub":"Inspect each step at the cancellation boundary","flow":false,"cards":[["Research completed","Keep the useful notes","Label partial output"],["Document submitted","Result may be unknown","Reconcile by request ID"],["Message not started","Do not schedule the send","Record it as skipped"]],"note":"A completed external action needs its own corrective policy."}],"post":"In FlowMaestro, a cancellation request has to reach the workflow and the work it is running. Stopping the updates in the browser is only one part of that process.\n\nA tool call may already have completed, or an external service may have accepted a request before the response was lost. The run needs to preserve what happened and reconcile anything still uncertain.\n\nThe design we’d use records the stop request, waits for the worker’s outcome and prevents new steps from starting. Completed work stays visible, and usage settlement follows the same guarded path as normal completion.\n\nThat gives the interface a useful distinction between “Stopping” and a confirmed result. It also avoids treating cancellation as proof that nothing happened or no usage was incurred.\n\nThe article covers the current cancellation mechanisms and a proposed approach to external effects, partial results and recovery:"};

let out='<text class="mono quiet" x="'+left+'" y="85">'+data.product.toUpperCase()+' / ENGINEERING NOTES</text>';

data.figures[0].cards.forEach((card,i)=>{const x=left+i*(cw+gap);out+='<rect class="box" x="'+x+'" y="'+rowY+'" width="'+cw+'" height="'+(square?260:155)+'" rx="4"/><text class="mono quiet" x="'+(x+22)+'" y="'+(rowY+31)+'">0'+(i+1)+'</text><text class="serif" style="font-size:'+(square?25:29)+'px" x="'+(x+22)+'" y="'+(rowY+76)+'">'+card[0]+'</text>';card.slice(1).forEach((t,j)=>{out+='<text class="quiet" style="font-size:'+(square?15:18)+'px" x="'+(x+22)+'" y="'+(rowY+(square?170:108)+j*25)+'">'+t+'</text>'})});

let lines=[''];for(const word of data.figures[0].note.split(' ')){let i=lines.length-1;if(lines[i].length+word.length>(square?65:120))lines.push(word);else lines[i]+=(lines[i]?' ':'')+word}lines.forEach((line,i)=>{out+='<text class="quiet" x="'+left+'" y="'+(y+10+i*29)+'">'+line+'</text>'});
out+='<text class="mono quiet" x="'+left+'" y="'+(square?905:555)+'">NBAGHIRO.COM</text><path class="line" d="M'+left+' 38h-20v20M'+(square?920:1500)+' 38h20v20M'+left+' '+(square?950:580)+'h-20v-20M'+(square?920:1500)+' '+(square?950:580)+'h20v-20"/>';svg.innerHTML=out;
