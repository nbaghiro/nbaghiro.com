<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Choosing an export for the next person</title><style>*{box-sizing:border-box;margin:0}html,body{background:#e9ecea}.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#e2e8e3}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.45)}.wash{position:absolute;inset:0;background:linear-gradient(140deg,rgba(235,239,233,.82),rgba(230,236,232,.93))}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:Georgia,serif;fill:#293d37}.quiet,.eyebrow{font-family:Arial,sans-serif;fill:#5c746c}.eyebrow{letter-spacing:3px;font-size:13px}.box{fill:#f6f7ef;fill-opacity:.68;stroke:#637b71;stroke-width:1.3}.boundary{fill:none;stroke:#9aafa5;stroke-width:1;stroke-dasharray:4 7}.line{fill:none;stroke:#526d62;stroke-width:1.8}.accent{fill:none;stroke:#437c70;stroke-width:2}.faint{fill:none;stroke:#81978b;stroke-width:1.4;opacity:.65}.dash{fill:none;stroke:#437c70;stroke-width:1.5;stroke-dasharray:5 5}.dot{fill:#437c70}.registration{fill:none;stroke:#8da196;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-engine.jpg" alt=""><div class="wash"></div><svg id="plate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#437c70" stroke-width="1"/></marker></defs><g id="content"><text x="60" y="0" font-size="13" class="eyebrow" text-anchor="start">DOCUMENTS</text><g transform="translate(0 35)"><rect x="55" y="20" width="330" height="185" rx="3" class="box"></rect><text x="77" y="62" font-size="25" class="label" text-anchor="start">One exported file</text><text x="77" y="96" font-size="17" class="quiet" text-anchor="start">Sent to the next person</text><path d="M85 108 L305 108" class="faint"></path><path d="M85 123 L239.0 123" class="faint"></path><rect x="85" y="140" width="165" height="56" rx="3" class="box"></rect><path d="M108 188 L108 168" class="faint"></path><path d="M133 188 L133 152" class="faint"></path><path d="M158 188 L158 174" class="faint"></path><path d="M183 188 L183 158" class="faint"></path><path d="M208 188 L208 164" class="faint"></path><path d="M400 112 L470 112" class="accent" marker-end="url(#arrow)"></path><path d="M510 58 l8 8 l18 -21" class="accent"></path><text x="550" y="63" font-size="23" class="label" text-anchor="start">It opens</text><path d="M510 112 l8 8 l18 -21" class="accent"></path><text x="550" y="117" font-size="23" class="label" text-anchor="start">It looks right</text><path d="M512 153 l16 26 M528 153 l-16 26" class="accent"></path><text x="550" y="171" font-size="23" class="label" text-anchor="start">The chart is a picture</text><text x="470" y="272" font-size="25" class="label" text-anchor="middle">the next task is the test</text></g></g></svg></div><script>const [w,h]=(location.hash.slice(1)||'2000x769').split('x').map(Number);document.querySelector('.sheet').style.cssText=`--w:${w}px;--h:${h}px`;const wide=w/h>2;document.querySelector('svg').setAttribute('viewBox',`0 0 940 ${wide?384:627}`);document.getElementById('content').setAttribute('transform',`translate(0 ${wide?32:145})`);</script></body></html>
