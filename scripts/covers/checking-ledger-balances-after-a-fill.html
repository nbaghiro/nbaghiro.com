<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Checking ledger balances after a fill</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Compare event postings with the balance derived from them. */
            * {
                margin: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: #e9ecea;
            }
            .sheet {
                position: relative;
                width: var(--w);
                height: var(--h);
                overflow: hidden;
                background: #dfe4e2;
            }
            .sheet img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 56%;
                filter: saturate(0.7) contrast(1);
            }
            .wash {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(233, 236, 234, 0.1) 0%,
                    rgba(233, 236, 234, 0.46) 32%,
                    rgba(233, 236, 234, 0.78) 60%,
                    rgba(233, 236, 234, 0.88) 100%
                );
            }
            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .ink {
                fill: none;
                stroke: #1b2522;
                stroke-width: 1.3;
            }
            .ink.thin {
                stroke-width: 1;
            }
            .tick {
                stroke: #46544f;
                stroke-width: 1.1;
            }
            .mist {
                fill: none;
                stroke: #7e8d88;
                stroke-width: 1;
            }
            .water {
                fill: none;
                stroke: #4e7872;
                stroke-width: 1.3;
            }
            .fillbox {
                fill: rgba(27, 37, 34, 0.08);
                stroke: none;
            }
            .land {
                fill: rgba(78, 120, 114, 0.14);
                stroke: none;
            }
            text {
                font-family: "Instrument Sans", system-ui, sans-serif;
                font-size: 12px;
                fill: #68756f;
            }
            text.name {
                font-family: "Newsreader", Georgia, serif;
                font-size: 18px;
                fill: #1b2522;
            }
            text.qty {
                fill: #4e7872;
            }
        </style>
    </head>
    <body>
        <div class="sheet">
            <img src="ph-offline.jpg" alt="" />
            <div class="wash"></div>
            <svg preserveAspectRatio="none" id="plate"></svg>
        </div>
        <script>
            // The event movement and resulting balance are checked separately.
            const S = document.getElementById("plate");
            const sheet = document.querySelector(".sheet");
            const [PW, PH] = (location.hash.slice(1) || "2000x769")
                .split("x")
                .map(Number);
            sheet.style.setProperty("--w", `${PW}px`);
            sheet.style.setProperty("--h", `${PH}px`);
            const wide = PW / PH > 2;
            if (!wide) {
                document.querySelector(".wash").style.background =
                    "linear-gradient(to bottom," +
                    " rgba(233,236,234,0.36) 0%," +
                    " rgba(233,236,234,0.64) 28%," +
                    " rgba(233,236,234,0.82) 58%," +
                    " rgba(233,236,234,0.9) 100%)";
            }
            const VB = wide ? [1000, 384] : [1000, 667];
            S.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
            const ns = "http://www.w3.org/2000/svg";
            const el = (name, attrs, text) => {
                const n = document.createElementNS(ns, name);
                for (const [k, v] of Object.entries(attrs))
                    n.setAttribute(k, v);
                if (text !== undefined) n.textContent = text;
                S.appendChild(n);
                return n;
            };
            const rect = (x, y, w, h, cls) =>
                el("rect", { x, y, width: w, height: h, class: cls });
            const path = (d, cls) => el("path", { d, class: cls });

            const rowY = wide ? 76 : 160;
            const H = wide ? 172 : 240;
            const box = (x, title, rows, result) => {
                rect(x, rowY, 380, H, "land");
                rect(x, rowY, 380, H, "ink");
                el("text", { x: x + 22, y: rowY + 32, class: "name" }, title);
                rows.forEach(([label, amount], i) => {
                    const y = rowY + 66 + i * 29;
                    el("text", { x: x + 22, y }, label);
                    el(
                        "text",
                        { x: x + 358, y, "text-anchor": "end", class: "qty" },
                        amount
                    );
                });
                path(`M${x + 22} ${rowY + 135} H${x + 358}`, "mist");
                el("text", { x: x + 22, y: rowY + 157, class: "name" }, result);
            };
            box(
                74,
                "Event postings",
                [
                    ["Cash movement", "−$1,200"],
                    ["Position cost", "+$1,200"],
                    ["Total", "$0"],
                ],
                "Postings balance"
            );
            box(
                546,
                "Projected cash",
                [
                    ["Starting cash", "$1,000"],
                    ["Cash movement", "−$1,200"],
                    ["Resulting cash", "−$200"],
                ],
                "Sleeve check fails"
            );
            path(`M454 ${rowY + H / 2} h92 m-8 -5 l8 5 -8 5`, "water");
            el(
                "text",
                {
                    x: 500,
                    y: wide ? 43 : 98,
                    "text-anchor": "middle",
                    class: "name",
                },
                "Checking ledger balances after a fill"
            );
            el(
                "text",
                {
                    x: 500,
                    y: rowY + H + 48,
                    "text-anchor": "middle",
                    class: "name",
                },
                "Record the fill · freeze the sleeve for review"
            );
            el(
                "text",
                { x: 500, y: rowY + H + 72, "text-anchor": "middle" },
                "Illustrative buy: 12 shares at $100, without fees"
            );
            // the registration ticks every plate and figure carries
            const RT = 18;
            const B = VB[1] - 26;
            for (const [x, y, sx, sy] of [
                [30, 26, 1, 1],
                [970, 26, -1, 1],
                [30, B, 1, -1],
                [970, B, -1, -1],
            ]) {
                path(`M${x} ${y} h${RT * sx}`, "ink thin");
                path(`M${x} ${y} v${RT * sy}`, "ink thin");
            }
        </script>
    </body>
</html>
