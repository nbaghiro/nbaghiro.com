const data={"slug":"when-shared-code-becomes-a-tool","title":"When shared code should become a separate tool","product":"General engineering","coverTitle":["When shared code","becomes a tool"],"figures":[{"id":"shared-tool-boundary","title":"Share behavior; keep policy explicit","sub":"Proposed boundary for repeated setup work","flow":true,"cards":[["Product input","Catalog and ownership scope","Approved business rules"],["Shared core","Compare observed state","Produce a reviewable plan"],["Provider adapter","Apply supported operations","Return explicit outcomes"]],"note":"A product name in every branch can signal that the boundary is too broad."},{"id":"shared-tool-release","title":"Test a release with its consumers","sub":"Compatibility includes behavior as well as function signatures","flow":true,"cards":[["Core tests","Planning and stable identity","Incomplete-state handling"],["Adapter checks","Pagination and error mapping","Ambiguous write outcomes"],["Consumer fixtures","Fresh, unchanged and partial","Pinned upgrades and fallback"]],"note":"A version number needs a defined public contract behind it."}],"post":"Repeated code across products can be a good starting point for a shared tool. The useful question is which behavior is actually the same.\n\nGalleo and Clientbridge both have setup scripts, but their product policies differ. We’d consider sharing stable mechanics such as identifying managed objects, comparing desired and observed state, and producing a reviewable plan.\n\nPlan limits, migration decisions and other business rules would remain explicit inputs or stay in the product.\n\nA separate tool also creates maintenance work: versioned behavior, adapter updates and tests against each consumer. Passing its own unit tests is not enough to show that an upgrade is safe for both products.\n\nThe article develops this proposed boundary, including dry runs, partial failures, stable identities and deciding when extraction is worth the extra release process:"};

out+='<text class="mono quiet" x="'+left+'" y="'+(square?905:555)+'">NBAGHIRO.COM</text><path class="line" d="M'+left+' 38h-20v20M'+(square?920:1500)+' 38h20v20M'+left+' '+(square?950:580)+'h-20v-20M'+(square?920:1500)+' '+(square?950:580)+'h20v-20"/>';svg.innerHTML=out;
