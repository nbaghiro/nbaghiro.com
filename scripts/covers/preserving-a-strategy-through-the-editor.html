<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Preserving a strategy through the editor</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Text, editor structure and exported text, in the site palette. */
            * {
                margin: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: #e9ecea;
            }
            .sheet {
                position: relative;
                width: var(--w);
                height: var(--h);
                overflow: hidden;
                background: #dfe4e2;
            }
            .sheet img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 56%;
                filter: saturate(0.7) contrast(1);
            }
            .wash {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(233, 236, 234, 0.1) 0%,
                    rgba(233, 236, 234, 0.46) 32%,
                    rgba(233, 236, 234, 0.78) 60%,
                    rgba(233, 236, 234, 0.88) 100%
                );
            }
            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .ink {
                fill: none;
                stroke: #1b2522;
                stroke-width: 1.3;
            }
            .ink.thin {
                stroke-width: 1;
            }
            .tick {
                stroke: #46544f;
                stroke-width: 1.1;
            }
            .mist {
                fill: none;
                stroke: #7e8d88;
                stroke-width: 1;
            }
            .water {
                fill: none;
                stroke: #4e7872;
                stroke-width: 1.3;
            }
            .fillbox {
                fill: rgba(27, 37, 34, 0.08);
                stroke: none;
            }
            .land {
                fill: rgba(78, 120, 114, 0.14);
                stroke: none;
            }
            text {
                font-family: "Instrument Sans", system-ui, sans-serif;
                font-size: 12px;
                fill: #68756f;
            }
            text.name {
                font-family: "Newsreader", Georgia, serif;
                font-size: 18px;
                fill: #1b2522;
            }
            text.qty {
                fill: #4e7872;
            }
        </style>
    </head>
    <body>
        <div class="sheet">
            <img src="ph-ledger.jpg" alt="" />
            <div class="wash"></div>
            <svg preserveAspectRatio="none" id="plate"></svg>
        </div>
        <script>
            // A round-trip retains the authored group and allocation.
            const S = document.getElementById("plate");
            const sheet = document.querySelector(".sheet");
            const [PW, PH] = (location.hash.slice(1) || "2000x769")
                .split("x")
                .map(Number);
            sheet.style.setProperty("--w", `${PW}px`);
            sheet.style.setProperty("--h", `${PH}px`);
            const wide = PW / PH > 2;
            if (!wide) {
                document.querySelector(".wash").style.background =
                    "linear-gradient(to bottom," +
                    " rgba(233,236,234,0.36) 0%," +
                    " rgba(233,236,234,0.64) 28%," +
                    " rgba(233,236,234,0.82) 58%," +
                    " rgba(233,236,234,0.9) 100%)";
            }
            const VB = wide ? [1000, 384] : [1000, 667];
            S.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
            const ns = "http://www.w3.org/2000/svg";
            const el = (name, attrs, text) => {
                const n = document.createElementNS(ns, name);
                for (const [k, v] of Object.entries(attrs))
                    n.setAttribute(k, v);
                if (text !== undefined) n.textContent = text;
                S.appendChild(n);
                return n;
            };
            const rect = (x, y, w, h, cls) =>
                el("rect", { x, y, width: w, height: h, class: cls });
            const path = (d, cls) => el("path", { d, class: cls });

            const y = wide ? 78 : 152;
            const boxH = wide ? 170 : 230;
            const box = (x, title, subtitle) => {
                rect(x, y, 252, boxH, "land");
                rect(x, y, 252, boxH, "ink");
                el("text", { x: x + 18, y: y + 32, class: "name" }, title);
                el("text", { x: x + 18, y: y + 54 }, subtitle);
            };
            box(74, "Source text", "group share written as :weight 60");
            box(374, "Editor tree", "share stored against the child ID");
            box(674, "Exported text", "same group, share and children");
            [104, 704].forEach((x) => {
                el(
                    "text",
                    { x, y: y + 94, class: "qty" },
                    '(group "Equities" :weight 60'
                );
                el("text", { x: x + 12, y: y + 117 }, "(weight :method equal");
                el(
                    "text",
                    { x: x + 24, y: y + 140 },
                    "(asset VTI) (asset QQQ)))"
                );
            });
            rect(418, y + 75, 164, 30, "ink");
            el("text", { x: 435, y: y + 95, class: "qty" }, "Equities · 60%");
            path(`M500 ${y + 105} v14 M446 ${y + 132} v-13 h108 v13`, "water");
            [420, 530].forEach((x, i) => {
                rect(x, y + 132, 60, 25, "ink");
                el("text", { x: x + 17, y: y + 149 }, i ? "QQQ" : "VTI");
            });
            [326, 626].forEach((x) =>
                path(`M${x} ${y + boxH / 2} h48 m-7 -4 l7 4 -7 4`, "water")
            );
            const baseY = y + boxH + 34;
            path(`M200 ${y + boxH} V${baseY} H800 V${y + boxH}`, "water");
            el(
                "text",
                {
                    x: 500,
                    y: baseY + 25,
                    "text-anchor": "middle",
                    class: "name",
                },
                "Compare the structure and values"
            );
            el(
                "text",
                {
                    x: 500,
                    y: wide ? 45 : 95,
                    "text-anchor": "middle",
                    class: "name",
                },
                "Preserving a strategy through the editor"
            );
            // the registration ticks every plate and figure carries
            const RT = 18;
            const B = VB[1] - 26;
            for (const [x, y, sx, sy] of [
                [30, 26, 1, 1],
                [970, 26, -1, 1],
                [30, B, 1, -1],
                [970, B, -1, -1],
            ]) {
                path(`M${x} ${y} h${RT * sx}`, "ink thin");
                path(`M${x} ${y} v${RT * sy}`, "ink thin");
            }
        </script>
    </body>
</html>
