<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Checking every version of an exercise</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* One item written once, and the versions its parameters produce, each one built
       and checked before any of them reaches a child. Over the same fog the rest of the
       site is photographed in, in the ink language of the post's figures. */
            * {
                margin: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: #e9ecea;
            }
            .sheet {
                position: relative;
                width: var(--w);
                height: var(--h);
                overflow: hidden;
                background: #dfe4e2;
            }
            .sheet img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 57%;
                filter: saturate(0.7) contrast(1);
            }
            .wash {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(233, 236, 234, 0.3) 0%,
                    rgba(233, 236, 234, 0.56) 32%,
                    rgba(233, 236, 234, 0.76) 60%,
                    rgba(233, 236, 234, 0.86) 100%
                );
            }
            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .ink {
                fill: none;
                stroke: #1b2522;
                stroke-width: 1.3;
            }
            .ink.thin {
                stroke-width: 1;
            }
            .mist {
                fill: none;
                stroke: #7e8d88;
                stroke-width: 1;
            }
            .mist.dash {
                stroke-dasharray: 5 4;
            }
            .water {
                fill: none;
                stroke: #4e7872;
                stroke-width: 1.3;
            }
            .fillbox {
                fill: rgba(27, 37, 34, 0.08);
                stroke: none;
            }
            .land {
                fill: rgba(78, 120, 114, 0.14);
                stroke: none;
            }
            /* the item card sits over the treeline, so it carries more of the paper than
               the rows below it, which sit on open water */
            .cardfill {
                fill: rgba(233, 236, 234, 0.58);
                stroke: none;
            }
            .tick {
                stroke: #46544f;
                stroke-width: 1.1;
            }
            text {
                font-family: "Instrument Sans", system-ui, sans-serif;
                font-size: 12px;
                fill: #68756f;
            }
            text.name {
                font-family: "Newsreader", Georgia, serif;
                font-size: 18px;
                fill: #1b2522;
            }
            text.value {
                font-family: "Newsreader", Georgia, serif;
                font-size: 17px;
                fill: #1b2522;
            }
        </style>
    </head>
    <body>
        <div class="sheet">
            <img src="base-lake.jpg" alt="" />
            <div class="wash"></div>
            <svg preserveAspectRatio="none" id="plate"></svg>
        </div>
        <script>
            // The template on the left, the questions it produces on the right. One of them
            // is marked, because its correct answer collides with the hint written for a
            // wrong one.
            const S = document.getElementById("plate");
            const sheet = document.querySelector(".sheet");
            const [PW, PH] = (location.hash.slice(1) || "2000x769")
                .split("x")
                .map(Number);
            sheet.style.setProperty("--w", `${PW}px`);
            sheet.style.setProperty("--h", `${PH}px`);
            const wide = PW / PH > 2;
            const VB = wide ? [1000, 384] : [1000, 667];
            S.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
            const ns = "http://www.w3.org/2000/svg";
            const el = (name, attrs, text) => {
                const n = document.createElementNS(ns, name);
                for (const [k, v] of Object.entries(attrs))
                    n.setAttribute(k, v);
                if (text !== undefined) n.textContent = text;
                S.appendChild(n);
                return n;
            };
            const rect = (x, y, w, h, cls) =>
                el("rect", { x, y, width: w, height: h, class: cls });
            const path = (d, cls) => el("path", { d, class: cls });

            // the item as it is written: one parameter, one answer over it
            const C = wide
                ? { x: 58, y: 104, w: 316, h: 186 }
                : { x: 74, y: 100, w: 852, h: 170 };
            rect(C.x, C.y, C.w, C.h, "cardfill");
            rect(C.x, C.y, C.w, C.h, "ink");
            el("text", { x: C.x + 22, y: C.y + 34, class: "name" }, "one item");
            el(
                "text",
                { x: C.x + 22, y: C.y + 54 },
                "written once, with a parameter"
            );
            ["let n = 3..8", "answer (10 − n)", "6 versions allowed"].forEach(
                (line, i) => {
                    el(
                        "text",
                        { x: C.x + 22, y: C.y + 92 + i * 30, class: "value" },
                        line
                    );
                }
            );

            // the versions the parameter produces, each with the answer it resolves to
            const rows = [3, 4, 5, 6, 7, 8].map((n) => ({ n, a: 10 - n }));
            const R = wide
                ? { x: 464, y: 52, w: 478, h: 34, pitch: 44 }
                : { x: 74, y: 326, w: 852, h: 34, pitch: 44 };
            rows.forEach((r, i) => {
                const y = R.y + i * R.pitch;
                const same = r.a === r.n;
                rect(R.x, y, R.w, R.h, same ? "land" : "fillbox");
                rect(R.x, y, R.w, R.h, same ? "water" : "mist");
                el("text", { x: R.x + 18, y: y + R.h / 2 + 5 }, `n = ${r.n}`);
                el(
                    "text",
                    {
                        x: R.x + R.w - 18,
                        y: y + R.h / 2 + 5,
                        "text-anchor": "end",
                        class: "value",
                    },
                    String(r.a)
                );
                if (same)
                    el(
                        "text",
                        {
                            x: R.x + R.w - 56,
                            y: y + R.h / 2 + 5,
                            "text-anchor": "end",
                        },
                        "the hint also fires here"
                    );
            });

            // the fan from the one item to the versions it produces
            const mid = R.y + (rows.length * R.pitch - (R.pitch - R.h)) / 2;
            if (wide) {
                rows.forEach((_, i) => {
                    path(
                        `M${C.x + C.w} ${C.y + C.h / 2} L${R.x - 14} ${R.y + i * R.pitch + R.h / 2}`,
                        "mist"
                    );
                });
            } else {
                rows.forEach((_, i) => {
                    path(
                        `M${C.x + C.w / 2} ${C.y + C.h} L${R.x + 70 + i * 142} ${R.y - 14}`,
                        "mist"
                    );
                });
            }

            // the measured rule along the foot, across the whole plate, ticked every
            // division and taller every fourth, with what the pass establishes beneath it
            const ruleY = wide ? 322 : 596;
            const ruleX = wide ? C.x : C.x;
            const ruleW = (wide ? R.x + R.w : C.x + C.w) - ruleX;
            path(`M${ruleX} ${ruleY} H${ruleX + ruleW}`, "tick");
            for (let i = 0; i <= 12; i += 1) {
                const x = ruleX + (ruleW / 12) * i;
                path(
                    `M${x} ${ruleY - (i % 4 === 0 ? 8 : 4)} V${ruleY}`,
                    "tick"
                );
            }
            el(
                "text",
                { x: ruleX, y: ruleY + 20 },
                "every version built before any of them is asked"
            );
            el(
                "text",
                {
                    x: ruleX + ruleW,
                    y: ruleY + 20,
                    "text-anchor": "end",
                },
                "5,622 items in the curriculum"
            );

            const A = 18;
            const B = VB[1] - 26;
            for (const [x, y, sx, sy] of [
                [30, 26, 1, 1],
                [970, 26, -1, 1],
                [30, B, 1, -1],
                [970, B, -1, -1],
            ]) {
                path(`M${x} ${y} h${A * sx}`, "ink thin");
                path(`M${x} ${y} v${A * sy}`, "ink thin");
            }
            void mid;
        </script>
    </body>
</html>
