<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Undoing a change across services</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}body{background:#e9ecea}.sheet{position:relative;width:100vw;height:100vh;overflow:hidden}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.21;filter:grayscale(1)}.wash{position:absolute;inset:0;background:linear-gradient(115deg,#e9eceaf0,#e9ecea55)}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:'Instrument Sans',sans-serif;fill:#283e37;font-size:18px}.serif{font-family:Newsreader,Georgia,serif}.mono{font-family:'JetBrains Mono',monospace;letter-spacing:1px;font-size:13px}.quiet{fill:#687d75}.line{stroke:#718a80;fill:none;stroke-width:1}.accent{stroke:#4e7872;fill:none;stroke-width:2}.box{fill:#f5f7f2a0;stroke:#82968c;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-callers.jpg" alt=""><div class="wash"></div><svg id="plate"></svg></div><script>
const data={"slug":"undoing-a-change-across-services","title":"Undoing a change across services","product":"Clientbridge","coverTitle":["Undoing a change","across services"],"figures":[{"id":"undo-new-command","title":"Returning to Tuesday is a new change","sub":"Proposed booking-correction flow","flow":true,"cards":[["Thursday confirmed","Keep the original history","Read the current revision"],["Tuesday requested","Check current availability","Check the expected revision"],["Correction accepted","Write a new revision","Queue external updates"]],"note":"The original slot may have been taken since the first move."},{"id":"undo-effect-policy","title":"Correct each effect on its own terms","sub":"A database change has several external consequences","flow":false,"cards":[["Calendar event","Update the existing event","Reconcile stale deliveries"],["Unsent reminder","Cancel or replace the job","Check for an in-flight send"],["Delivered message","Send a correction if needed","Keep both actions recorded"]],"note":"One status should not conceal different outcomes across services."}],"post":"Moving a booking can update a calendar, replace a reminder and send a confirmation. Putting it back later needs to account for each of those effects.\n\nFor a product like Clientbridge, we’d treat the correction as a new command. The server checks the current booking revision and whether the original slot is still available, then records the accepted change and its follow-up work.\n\nEach external effect needs its own handling. A calendar event can be updated. An unsent reminder can be replaced. A confirmation already delivered may need a correction message.\n\nRetries and ordering matter too. An older calendar update arriving late should not leave the calendar showing a time that the business has already changed again.\n\nThe article develops this proposed workflow, including operation identities, concurrent edits and clear status when only part of the correction has finished:"};

data.figures[0].cards.forEach((card,i)=>{const x=left+i*(cw+gap);out+='<rect class="box" x="'+x+'" y="'+rowY+'" width="'+cw+'" height="'+(square?260:155)+'" rx="4"/><text class="mono quiet" x="'+(x+22)+'" y="'+(rowY+31)+'">0'+(i+1)+'</text><text class="serif" style="font-size:'+(square?25:29)+'px" x="'+(x+22)+'" y="'+(rowY+76)+'">'+card[0]+'</text>';card.slice(1).forEach((t,j)=>{out+='<text class="quiet" style="font-size:'+(square?15:18)+'px" x="'+(x+22)+'" y="'+(rowY+(square?170:108)+j*25)+'">'+t+'</text>'})});
const y=square?695:465;out+='<path class="accent" d="M'+left+' '+(y-25)+'H'+(square?920:1500)+'"/>';
let lines=[''];for(const word of data.figures[0].note.split(' ')){let i=lines.length-1;if(lines[i].length+word.length>(square?65:120))lines.push(word);else lines[i]+=(lines[i]?' ':'')+word}lines.forEach((line,i)=>{out+='<text class="quiet" x="'+left+'" y="'+(y+10+i*29)+'">'+line+'</text>'});
out+='<text class="mono quiet" x="'+left+'" y="'+(square?905:555)+'">NBAGHIRO.COM</text><path class="line" d="M'+left+' 38h-20v20M'+(square?920:1500)+' 38h20v20M'+left+' '+(square?950:580)+'h-20v-20M'+(square?920:1500)+' '+(square?950:580)+'h20v-20"/>';svg.innerHTML=out;
