<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>A language for portfolio allocations</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* The run the reader asked about, and the longer run the data request actually
       covers. The warm-up is drawn as the span before the first order rather than as a
       number, because the whole point is that it sits outside the period in question.
       Over the same fog the rest of the site is photographed in. */
            * {
                margin: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: #e9ecea;
            }
            .sheet {
                position: relative;
                width: var(--w);
                height: var(--h);
                overflow: hidden;
                background: #dfe4e2;
            }
            .sheet img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 56%;
                filter: saturate(0.7) contrast(1);
            }
            .wash {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(233, 236, 234, 0.1) 0%,
                    rgba(233, 236, 234, 0.46) 32%,
                    rgba(233, 236, 234, 0.78) 60%,
                    rgba(233, 236, 234, 0.88) 100%
                );
            }
            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .ink {
                fill: none;
                stroke: #1b2522;
                stroke-width: 1.3;
            }
            .ink.thin {
                stroke-width: 1;
            }
            .tick {
                stroke: #46544f;
                stroke-width: 1.1;
            }
            .mist {
                fill: none;
                stroke: #7e8d88;
                stroke-width: 1;
            }
            .water {
                fill: none;
                stroke: #4e7872;
                stroke-width: 1.3;
            }
            .fillbox {
                fill: rgba(27, 37, 34, 0.08);
                stroke: none;
            }
            .land {
                fill: rgba(78, 120, 114, 0.14);
                stroke: none;
            }
            text {
                font-family: "Instrument Sans", system-ui, sans-serif;
                font-size: 12px;
                fill: #68756f;
            }
            text.name {
                font-family: "Newsreader", Georgia, serif;
                font-size: 18px;
                fill: #1b2522;
            }
            text.qty {
                fill: #4e7872;
            }
        </style>
    </head>
    <body>
        <div class="sheet">
            <img src="ph-variants.jpg" alt="" />
            <div class="wash"></div>
            <svg preserveAspectRatio="none" id="plate"></svg>
        </div>
        <script>
            // A run of bars with the warm-up span drawn before the first order: the part of the
            // fetch that exists only so the indicators are defined on day one.
            const S = document.getElementById("plate");
            const sheet = document.querySelector(".sheet");
            const [PW, PH] = (location.hash.slice(1) || "2000x769")
                .split("x")
                .map(Number);
            sheet.style.setProperty("--w", `${PW}px`);
            sheet.style.setProperty("--h", `${PH}px`);
            const wide = PW / PH > 2;
            if (!wide) {
                document.querySelector(".wash").style.background =
                    "linear-gradient(to bottom," +
                    " rgba(233,236,234,0.36) 0%," +
                    " rgba(233,236,234,0.64) 28%," +
                    " rgba(233,236,234,0.82) 58%," +
                    " rgba(233,236,234,0.9) 100%)";
            }
            const VB = wide ? [1000, 384] : [1000, 667];
            S.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
            const ns = "http://www.w3.org/2000/svg";
            const el = (name, attrs, text) => {
                const n = document.createElementNS(ns, name);
                for (const [k, v] of Object.entries(attrs))
                    n.setAttribute(k, v);
                if (text !== undefined) n.textContent = text;
                S.appendChild(n);
                return n;
            };
            const rect = (x, y, w, h, cls) =>
                el("rect", { x, y, width: w, height: h, class: cls });
            const path = (d, cls) => el("path", { d, class: cls });

            const rowY = wide ? 86 : 130;
            const lower = wide ? 216 : 370;
            const H = wide ? 60 : 90;
            const box = (x, y, w, title, note) => {
                rect(x, y, w, H, "land");
                rect(x, y, w, H, "ink");
                el("text", {x:x+14,y:y+28,class:"name"}, title);
                el("text", {x:x+14,y:y+48}, note);
            };
            box(72,rowY,510,"Equities · 60%","two assets, weighted equally");
            box(628,rowY,300,"Bonds · 40%","one asset");
            path(`M327 ${rowY+H} V${lower-25} M195 ${lower-25} H459 M195 ${lower-25} V${lower} M459 ${lower-25} V${lower}`,"water");
            path(`M778 ${rowY+H} V${lower}`,"water");
            box(72,lower,246,"VTI · 30%","60 × 50 / 100");
            box(336,lower,246,"QQQ · 30%","60 × 50 / 100");
            box(628,lower,300,"TLT · 40%","40 × 100 / 100");
            el("text",{x:72,y:wide?330:560,class:"name"},"How allocations compose");
            el("text",{x:72,y:wide?350:584},"The parent assigns a share. Each child divides that share internally.");

            // the registration ticks every plate and figure carries
            const RT = 18;
            const B = VB[1] - 26;
            for (const [x, y, sx, sy] of [
                [30, 26, 1, 1],
                [970, 26, -1, 1],
                [30, B, 1, -1],
                [970, B, -1, -1],
            ]) {
                path(`M${x} ${y} h${RT * sx}`, "ink thin");
                path(`M${x} ${y} v${RT * sy}`, "ink thin");
            }
        </script>
    </body>
</html>
