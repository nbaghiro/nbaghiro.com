<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>One screen writes offline</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* The loop the product is built on: a device reading its own copy, a command going the
       other way, and the row coming back through the replication log. Over the same fog the
       rest of the site is photographed in, in the ink language of the post's figures. */
            * {
                margin: 0;
                box-sizing: border-box;
            }
            html,
            body {
                background: #e9ecea;
            }
            .sheet {
                position: relative;
                width: var(--w);
                height: var(--h);
                overflow: hidden;
                background: #dfe4e2;
            }
            .sheet img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 52%;
                filter: saturate(0.7) contrast(1);
            }
            .wash {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(233, 236, 234, 0.06) 0%,
                    rgba(233, 236, 234, 0.4) 30%,
                    rgba(233, 236, 234, 0.74) 58%,
                    rgba(233, 236, 234, 0.84) 100%
                );
            }
            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .ink {
                fill: none;
                stroke: #1b2522;
                stroke-width: 1.3;
            }
            .ink.thin {
                stroke-width: 1;
            }
            .mist {
                fill: none;
                stroke: #7e8d88;
                stroke-width: 1;
            }
            .mist.dash {
                stroke-dasharray: 5 4;
            }
            .water {
                fill: none;
                stroke: #4e7872;
                stroke-width: 1.3;
            }
            .fillbox {
                fill: rgba(27, 37, 34, 0.08);
                stroke: none;
            }
            .land {
                fill: rgba(78, 120, 114, 0.14);
                stroke: none;
            }
            .tick {
                stroke: #46544f;
                stroke-width: 1.1;
            }
            text {
                font-family: "Instrument Sans", system-ui, sans-serif;
                font-size: 12px;
                fill: #68756f;
            }
            text.name {
                font-family: "Newsreader", Georgia, serif;
                font-size: 18px;
                fill: #1b2522;
            }
        </style>
    </head>
    <body>
        <div class="sheet">
            <img src="base-ridge.jpg" alt="" />
            <div class="wash"></div>
            <svg preserveAspectRatio="none" id="plate"></svg>
        </div>
        <script>
            // Reads come out of the log into the device's own database; writes go back as a
            // command and return the same way. One screen is allowed to queue a write.
            const S = document.getElementById("plate");
            const sheet = document.querySelector(".sheet");
            const [PW, PH] = (location.hash.slice(1) || "2000x769")
                .split("x")
                .map(Number);
            sheet.style.setProperty("--w", `${PW}px`);
            sheet.style.setProperty("--h", `${PH}px`);
            const wide = PW / PH > 2;
            const VB = wide ? [1000, 384] : [1000, 667];
            S.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
            const ns = "http://www.w3.org/2000/svg";
            const el = (name, attrs, text) => {
                const n = document.createElementNS(ns, name);
                for (const [k, v] of Object.entries(attrs))
                    n.setAttribute(k, v);
                if (text !== undefined) n.textContent = text;
                S.appendChild(n);
                return n;
            };
            const rect = (x, y, w, h, cls) =>
                el("rect", { x, y, width: w, height: h, class: cls });
            const path = (d, cls) => el("path", { d, class: cls });
            const arrowH = (x1, x2, y, cls) => {
                path(`M${x1} ${y} H${x2}`, cls);
                const s = x2 > x1 ? -1 : 1;
                path(`M${x2} ${y} l${7 * s} -4 M${x2} ${y} l${7 * s} 4`, cls);
            };

            // the device, holding the day it already has
            const D = wide
                ? { x: 60, y: 96, w: 300, h: 190 }
                : { x: 56, y: 186, w: 362, h: 268 };
            rect(D.x, D.y, D.w, D.h, "fillbox");
            rect(D.x, D.y, D.w, D.h, "ink");
            el("text", { x: D.x, y: D.y - 24, class: "name" }, "the device");
            el("text", { x: D.x, y: D.y - 8 }, "its own copy of the business");
            for (let i = 0; i < 5; i += 1) {
                const y = D.y + 26 + i * 22;
                rect(D.x + 18, y, D.w - 36, 14, i === 2 ? "land" : "mist");
            }
            // the one thing it may write, waiting its turn
            const Q = { x: D.x + 18, y: D.y + D.h - 54, w: D.w - 36, h: 36 };
            rect(Q.x, Q.y, Q.w, Q.h, "fillbox");
            rect(Q.x, Q.y, Q.w, Q.h, "ink thin");
            el("text", { x: Q.x + 12, y: Q.y + 22 }, "a working week, queued");

            // the server, and what it alone can settle
            const V = wide
                ? { x: 620, y: 96, w: 320, h: 190 }
                : { x: 566, y: 186, w: 378, h: 268 };
            rect(V.x, V.y, V.w, V.h, "ink");
            el("text", { x: V.x, y: V.y - 24, class: "name" }, "one command");
            el("text", { x: V.x, y: V.y - 8 }, "locked, checked, written once");
            [
                "time off",
                "the hours",
                "the seat",
                "the overlap",
                "the number",
            ].forEach((name, i) => {
                const y = V.y + 30 + i * 32;
                path(`M${V.x + 20} ${y} l6 7 l12 -15`, "water");
                el("text", { x: V.x + 48, y: y + 6 }, name);
            });

            // the loop: a write goes right, the row comes back along the top
            const mid = wide ? D.y + D.h / 2 : null;
            if (wide) {
                arrowH(D.x + D.w, V.x, mid, "water");
                el(
                    "text",
                    {
                        x: (D.x + D.w + V.x) / 2,
                        y: mid - 10,
                        "text-anchor": "middle",
                    },
                    "a write"
                );
                path(
                    `M${V.x + V.w} ${V.y + V.h - 30} H${V.x + V.w + 22} V56 H${D.x - 20} V${D.y + 44}`,
                    "water"
                );
                path(
                    `M${D.x - 20} ${D.y + 44} l-4 -7 M${D.x - 20} ${D.y + 44} l4 -7`,
                    "water"
                );
                el(
                    "text",
                    { x: 500, y: 46, "text-anchor": "middle" },
                    "and back out through the replication log"
                );
            } else {
                arrowH(D.x + D.w + 8, V.x - 8, D.y + 134, "water");
                el(
                    "text",
                    {
                        x: (D.x + D.w + V.x) / 2,
                        y: D.y + 120,
                        "text-anchor": "middle",
                    },
                    "a write"
                );
                path(
                    `M${V.x + V.w / 2} ${V.y + V.h} V${V.y + V.h + 48} H${D.x + D.w / 2} V${D.y + D.h + 16}`,
                    "water"
                );
                path(
                    `M${D.x + D.w / 2} ${D.y + D.h + 16} l-4 7 M${D.x + D.w / 2} ${D.y + D.h + 16} l4 7`,
                    "water"
                );
                el(
                    "text",
                    { x: 500, y: V.y + V.h + 68, "text-anchor": "middle" },
                    "and back out through the replication log"
                );
            }

            // the measured rule under the device, and the corner marks
            const ruleY = wide ? D.y + D.h + 28 : D.y + D.h + 128;
            path(`M${D.x} ${ruleY} H${D.x + D.w}`, "tick");
            for (let i = 0; i <= 4; i += 1) {
                const x = D.x + (D.w / 4) * i;
                path(
                    `M${x} ${ruleY - (i % 4 === 0 ? 6 : 4)} V${ruleY}`,
                    "tick"
                );
            }
            el(
                "text",
                { x: D.x, y: ruleY + 18 },
                "reads need nothing from the server"
            );

            const R = 18;
            const B = VB[1] - 26;
            for (const [x, y, sx, sy] of [
                [30, 26, 1, 1],
                [970, 26, -1, 1],
                [30, B, 1, -1],
                [970, B, -1, -1],
            ]) {
                path(`M${x} ${y} h${R * sx}`, "ink thin");
                path(`M${x} ${y} v${R * sy}`, "ink thin");
            }
        </script>
    </body>
</html>
