<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Checking whether an agent completed the task</title><style>*{box-sizing:border-box;margin:0}html,body{background:#e9ecea}.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#e2e8e3}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.45)}.wash{position:absolute;inset:0;background:linear-gradient(140deg,rgba(235,239,233,.82),rgba(230,236,232,.93))}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:Georgia,serif;fill:#293d37}.quiet,.eyebrow{font-family:Arial,sans-serif;fill:#5c746c}.eyebrow{letter-spacing:3px;font-size:13px}.box{fill:#f6f7ef;fill-opacity:.68;stroke:#637b71;stroke-width:1.3}.boundary{fill:none;stroke:#9aafa5;stroke-width:1;stroke-dasharray:4 7}.line{fill:none;stroke:#526d62;stroke-width:1.8}.accent{fill:none;stroke:#437c70;stroke-width:2}.faint{fill:none;stroke:#81978b;stroke-width:1.4;opacity:.65}.dash{fill:none;stroke:#437c70;stroke-width:1.5;stroke-dasharray:5 5}.dot{fill:#437c70}.registration{fill:none;stroke:#8da196;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-slot.jpg" alt=""><div class="wash"></div><svg id="plate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#437c70" stroke-width="1"/></marker></defs><g id="content"><text x="60" y="0" font-size="13" class="eyebrow" text-anchor="start">AI SYSTEMS</text><g transform="translate(0 35)"><rect x="80" y="15" width="310" height="225" rx="3" class="box"></rect><text x="102" y="57" font-size="25" class="label" text-anchor="start">Conversation</text><text x="102" y="91" font-size="17" class="quiet" text-anchor="start">What the agent said</text><path d="M105 120 L335 120" class="faint"></path><path d="M105 135 L335 135" class="faint"></path><path d="M105 150 L335 150" class="faint"></path><path d="M105 165 L266.0 165" class="faint"></path><path d="M410 125 L495 125" class="accent" marker-end="url(#arrow)"></path><rect x="515" y="15" width="340" height="225" rx="3" class="box"></rect><text x="537" y="57" font-size="25" class="label" text-anchor="start">System state</text><text x="537" y="91" font-size="17" class="quiet" text-anchor="start">What actually changed</text><path d="M545 135 l8 8 l18 -21" class="accent"></path><text x="585" y="140" font-size="21" class="label" text-anchor="start">correct record</text><path d="M545 183 l8 8 l18 -21" class="accent"></path><text x="585" y="188" font-size="21" class="label" text-anchor="start">expected result</text></g></g></svg></div><script>const [w,h]=(location.hash.slice(1)||'2000x769').split('x').map(Number);document.querySelector('.sheet').style.cssText=`--w:${w}px;--h:${h}px`;const wide=w/h>2;document.querySelector('svg').setAttribute('viewBox',`0 0 940 ${wide?384:627}`);const g=document.getElementById('content');
// The drawings are authored against the wide frame. Dropped into the taller card crop they kept
// their size, so every plate sat in a band with a third of the frame empty under it. The card
// measures what was actually drawn and fits it, which each plate needs separately because they
// are not the same height. Capped so a short drawing does not balloon its type past the others.
if(wide){g.setAttribute('transform','translate(0 32)');}
else{const b=g.getBBox(),p=44,
 k=Math.min(1.22,(940-p*2)/b.width,(627-p*2)/b.height);
 g.setAttribute('transform',`translate(${(940-b.width*k)/2-b.x*k} ${(627-b.height*k)/2-b.y*k}) scale(${k})`);}</script></body></html>
