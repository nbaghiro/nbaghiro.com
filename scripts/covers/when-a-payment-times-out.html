<!doctype html><html lang="en"><head><meta charset="utf-8"><title>When a payment times out</title><style>*{box-sizing:border-box;margin:0}html,body{background:#e9ecea}.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#e2e8e3}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.45)}.wash{position:absolute;inset:0;background:linear-gradient(140deg,rgba(235,239,233,.82),rgba(230,236,232,.93))}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:Georgia,serif;fill:#293d37}.quiet,.eyebrow{font-family:Arial,sans-serif;fill:#5c746c}.eyebrow{letter-spacing:3px;font-size:13px}.box{fill:#f6f7ef;fill-opacity:.68;stroke:#637b71;stroke-width:1.3}.boundary{fill:none;stroke:#9aafa5;stroke-width:1;stroke-dasharray:4 7}.line{fill:none;stroke:#526d62;stroke-width:1.8}.accent{fill:none;stroke:#437c70;stroke-width:2}.faint{fill:none;stroke:#81978b;stroke-width:1.4;opacity:.65}.dash{fill:none;stroke:#437c70;stroke-width:1.5;stroke-dasharray:5 5}.dot{fill:#437c70}.registration{fill:none;stroke:#8da196;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-slot.jpg" alt=""><div class="wash"></div><svg id="plate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#437c70" stroke-width="1"/></marker></defs><g id="content"><text x="60" y="0" font-size="13" class="eyebrow" text-anchor="start">PAYMENTS</text><g transform="translate(0 35)"><rect x="65" y="30" width="230" height="155" rx="3" class="box"></rect><text x="87" y="72" font-size="25" class="label" text-anchor="start">Submitted</text><text x="87" y="106" font-size="17" class="quiet" text-anchor="start">One purchase</text><rect x="620" y="30" width="250" height="155" rx="3" class="box"></rect><text x="642" y="72" font-size="25" class="label" text-anchor="start">Processed</text><text x="642" y="106" font-size="17" class="quiet" text-anchor="start">Record to confirm</text><path d="M310 75 L600 75" class="accent" marker-end="url(#arrow)"></path><path d="M615 140 H485 M440 140 H310" class="faint"></path><path d="M455 127 l16 26 M471 127 l-16 26" class="accent"></path><text x="455" y="198" font-size="20" class="quiet" text-anchor="middle">confirmation interrupted</text><path d="M180 200 V235 H745 V200" class="accent"></path><text x="460" y="269" font-size="25" class="label" text-anchor="middle">check the same operation</text></g></g></svg></div><script>const [w,h]=(location.hash.slice(1)||'2000x769').split('x').map(Number);document.querySelector('.sheet').style.cssText=`--w:${w}px;--h:${h}px`;const wide=w/h>2;document.querySelector('svg').setAttribute('viewBox',`0 0 940 ${wide?384:627}`);document.getElementById('content').setAttribute('transform',`translate(0 ${wide?32:145})`);</script></body></html>
