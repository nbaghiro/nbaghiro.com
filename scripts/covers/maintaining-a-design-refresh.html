<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Making a design refresh easier to maintain</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}body{background:#e9ecea}.sheet{position:relative;width:100vw;height:100vh;overflow:hidden}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.21;filter:grayscale(1)}.wash{position:absolute;inset:0;background:linear-gradient(115deg,#e9eceaf0,#e9ecea55)}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:'Instrument Sans',sans-serif;fill:#283e37;font-size:18px}.serif{font-family:Newsreader,Georgia,serif}.mono{font-family:'JetBrains Mono',monospace;letter-spacing:1px;font-size:13px}.quiet{fill:#687d75}.line{stroke:#718a80;fill:none;stroke-width:1}.accent{stroke:#4e7872;fill:none;stroke-width:2}.box{fill:#f5f7f2a0;stroke:#82968c;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-callers.jpg" alt=""><div class="wash"></div><svg id="plate"></svg></div><script>
const data={"slug":"maintaining-a-design-refresh","title":"Making a design refresh easier to maintain","product":"LlamaTrade","coverTitle":["Maintaining","a design refresh"],"figures":[{"id":"design-token-roles","title":"Appearance and meaning have distinct roles","sub":"Building from LlamaTrade’s appearance definitions","flow":false,"cards":[["Surfaces","Canvas, panel and borders","Light and dark choices"],["Accent","Text, fill and text-on-fill","Selection and controls"],["Financial meaning","Gain, loss and warning","Keep the roles consistent"]],"note":"Labels and signs carry information alongside color."},{"id":"design-review-matrix","title":"Data checks and rendered review","sub":"Proposed coverage for future appearance changes","flow":false,"cards":[["Resolve every option","Required tokens exist","Check actual color pairs"],["Render difficult states","Focus, loss and warning","Long values and errors"],["Compare platforms","Shared semantic roles","Deliberate layout differences"]],"note":"A launch screenshot covers only one state of a component."}],"post":"We’re pleased with how LlamaTrade’s design cleanup came together. Revisiting the earlier look helped us make the screens more consistent and clarify the choices behind them.\n\nOne useful distinction is between appearance and meaning. People can choose an accent or surface while gains, losses and warnings keep their own roles. Button fills and the text on them also need separate choices.\n\nOn the web, saved preferences are applied before the application starts. The native app has its own palette resolver. Keeping those paths aligned takes more than giving their tokens the same names.\n\nThe article looks at the implementation and the checks we’d use as the design grows: theme combinations, focus states, long values, empty screens and cross-platform differences.\n\nThose are the details that help the next screen fit the design as well as the current ones:"};
const square=innerHeight>innerWidth*.7,svg=document.querySelector('svg');svg.setAttribute('viewBox',square?'0 0 1000 1000':'0 0 1600 615');
const left=square?80:100,rowY=square?350:255,cw=square?256:400,gap=square?36:70;
let out='<text class="mono quiet" x="'+left+'" y="85">'+data.product.toUpperCase()+' / ENGINEERING NOTES</text>';
data.coverTitle.forEach((line,i)=>{out+='<text class="serif" style="font-size:'+(square?58:54)+'px" x="'+left+'" y="'+(square?160+i*62:145+i*57)+'">'+line+'</text>'});
data.figures[0].cards.forEach((card,i)=>{const x=left+i*(cw+gap);out+='<rect class="box" x="'+x+'" y="'+rowY+'" width="'+cw+'" height="'+(square?260:155)+'" rx="4"/><text class="mono quiet" x="'+(x+22)+'" y="'+(rowY+31)+'">0'+(i+1)+'</text><text class="serif" style="font-size:'+(square?25:29)+'px" x="'+(x+22)+'" y="'+(rowY+76)+'">'+card[0]+'</text>';card.slice(1).forEach((t,j)=>{out+='<text class="quiet" style="font-size:'+(square?15:18)+'px" x="'+(x+22)+'" y="'+(rowY+(square?170:108)+j*25)+'">'+t+'</text>'})});
const y=square?695:465;out+='<path class="accent" d="M'+left+' '+(y-25)+'H'+(square?920:1500)+'"/>';
let lines=[''];for(const word of data.figures[0].note.split(' ')){let i=lines.length-1;if(lines[i].length+word.length>(square?65:120))lines.push(word);else lines[i]+=(lines[i]?' ':'')+word}lines.forEach((line,i)=>{out+='<text class="quiet" x="'+left+'" y="'+(y+10+i*29)+'">'+line+'</text>'});
out+='<text class="mono quiet" x="'+left+'" y="'+(square?905:555)+'">NBAGHIRO.COM</text><path class="line" d="M'+left+' 38h-20v20M'+(square?920:1500)+' 38h20v20M'+left+' '+(square?950:580)+'h-20v-20M'+(square?920:1500)+' '+(square?950:580)+'h20v-20"/>';svg.innerHTML=out;
</script></body></html>
