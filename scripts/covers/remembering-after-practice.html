<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Checking what a learner remembers later</title><style>*{box-sizing:border-box;margin:0}html,body{background:#e9ecea}.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#e2e8e3}.sheet img{position:absolute;width:100%;height:100%;object-fit:cover;filter:saturate(.45)}.wash{position:absolute;inset:0;background:linear-gradient(140deg,rgba(235,239,233,.82),rgba(230,236,232,.93))}svg{position:absolute;inset:0;width:100%;height:100%}text{font-family:Georgia,serif;fill:#293d37}.quiet,.eyebrow{font-family:Arial,sans-serif;fill:#5c746c}.eyebrow{letter-spacing:3px;font-size:13px}.box{fill:#f6f7ef;fill-opacity:.68;stroke:#637b71;stroke-width:1.3}.boundary{fill:none;stroke:#9aafa5;stroke-width:1;stroke-dasharray:4 7}.line{fill:none;stroke:#526d62;stroke-width:1.8}.accent{fill:none;stroke:#437c70;stroke-width:2}.faint{fill:none;stroke:#81978b;stroke-width:1.4;opacity:.65}.dash{fill:none;stroke:#437c70;stroke-width:1.5;stroke-dasharray:5 5}.dot{fill:#437c70}.registration{fill:none;stroke:#8da196;stroke-width:1}</style></head><body><div class="sheet"><img src="ph-engine.jpg" alt=""><div class="wash"></div><svg id="plate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#437c70" stroke-width="1"/></marker></defs><g id="content"><text x="60" y="0" font-size="13" class="eyebrow" text-anchor="start">LEARNING</text><g transform="translate(0 35)"><circle cx="150" cy="80" r="42" class="line"></circle><text x="150" y="88" font-size="26" class="label" text-anchor="middle">1</text><text x="150" y="164" font-size="24" class="label" text-anchor="middle">Study</text><text x="150" y="200" font-size="18" class="quiet" text-anchor="middle">Meet the idea</text><circle cx="430" cy="80" r="42" class="line"></circle><text x="430" y="88" font-size="26" class="label" text-anchor="middle">2</text><text x="430" y="164" font-size="24" class="label" text-anchor="middle">Recall</text><text x="430" y="200" font-size="18" class="quiet" text-anchor="middle">Try without the text</text><circle cx="820" cy="80" r="42" class="line"></circle><text x="820" y="88" font-size="26" class="label" text-anchor="middle">3</text><text x="820" y="164" font-size="24" class="label" text-anchor="middle">Return</text><text x="820" y="200" font-size="18" class="quiet" text-anchor="middle">Check after a delay</text><path d="M198 80 L382 80" class="accent" marker-end="url(#arrow)"></path><path d="M478 80 L772 80" class="accent" marker-end="url(#arrow)"></path><text x="625" y="62" font-size="19" class="quiet" text-anchor="middle">two days, then a week</text><text x="470" y="268" font-size="25" class="label" text-anchor="middle">the delay is part of the test</text></g></g></svg></div><script>const [w,h]=(location.hash.slice(1)||'2000x769').split('x').map(Number);document.querySelector('.sheet').style.cssText=`--w:${w}px;--h:${h}px`;const wide=w/h>2;document.querySelector('svg').setAttribute('viewBox',`0 0 940 ${wide?384:627}`);const g=document.getElementById('content');
// The drawings are authored against the wide frame. Dropped into the taller card crop they kept
// their size, so every plate sat in a band with a third of the frame empty under it. The card
// measures what was actually drawn and fits it, which each plate needs separately because they
// are not the same height. Capped so a short drawing does not balloon its type past the others.
if(wide){g.setAttribute('transform','translate(0 32)');}
else{const b=g.getBBox(),p=44,
 k=Math.min(1.22,(940-p*2)/b.width,(627-p*2)/b.height);
 g.setAttribute('transform',`translate(${(940-b.width*k)/2-b.x*k} ${(627-b.height*k)/2-b.y*k}) scale(${k})`);}</script></body></html>
