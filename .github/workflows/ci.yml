# Lint and build on every push and pull request to main. Render deploys a push to main
# only after this workflow passes (autoDeployTrigger: checksPass in render.yaml).
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json # reads engines.node
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm run build
