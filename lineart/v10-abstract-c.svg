<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Abstract style C: Overlapping transparent layers -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Layer 1 - outermost, most transparent -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.2">
      <ellipse cx="100" cy="105" rx="55" ry="65"/>
      <path d="M45 85 Q45 35 100 30 Q155 35 155 85"/>
    </g>

    <!-- Layer 2 -->
    <g stroke="#ffffff" stroke-width="1.2" opacity="0.35">
      <ellipse cx="100" cy="102" rx="50" ry="60"/>
      <path d="M50 82 Q50 38 100 33 Q150 38 150 82"/>
      <path d="M65 80 Q80 72 95 80"/>
      <path d="M105 80 Q120 72 135 80"/>
    </g>

    <!-- Layer 3 -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.5">
      <ellipse cx="100" cy="100" rx="45" ry="55"/>
      <path d="M55 80 Q55 42 100 38 Q145 42 145 80"/>
      <ellipse cx="78" cy="92" rx="10" ry="9"/>
      <ellipse cx="122" cy="92" rx="10" ry="9"/>
    </g>

    <!-- Layer 4 -->
    <g stroke="#ffffff" stroke-width="1.8" opacity="0.7">
      <ellipse cx="100" cy="98" rx="40" ry="50"/>
      <path d="M60 78 Q60 45 100 42 Q140 45 140 78"/>
      <path d="M68 82 Q80 76 92 82"/>
      <path d="M108 82 Q120 76 132 82"/>
      <ellipse cx="80" cy="94" rx="8" ry="7"/>
      <ellipse cx="120" cy="94" rx="8" ry="7"/>
      <path d="M100 88 L97 108 Q100 114 103 108"/>
    </g>

    <!-- Layer 5 - innermost, most opaque -->
    <g stroke="#ffffff" stroke-width="2" opacity="1">
      <path d="M65 80 Q80 74 95 80" stroke-width="2.5"/>
      <path d="M105 80 Q120 74 135 80" stroke-width="2.5"/>
      <circle cx="80" cy="95" r="5"/>
      <circle cx="120" cy="95" r="5"/>
      <circle cx="80" cy="95" r="2" fill="#fff"/>
      <circle cx="120" cy="95" r="2" fill="#fff"/>
      <path d="M82 120 Q100 128 118 120"/>
      <path d="M88 135 Q100 142 112 135"/>
    </g>

    <!-- Beard layers -->
    <path d="M60 125 Q52 155 80 175 Q100 185 120 175 Q148 155 140 125"
          stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <path d="M65 122 Q58 150 82 168 Q100 178 118 168 Q142 150 135 122"
          stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <path d="M70 120 Q65 145 85 162 Q100 170 115 162 Q135 145 130 120"
          stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
