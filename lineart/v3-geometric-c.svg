<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Geometric style C: Fragmented/shattered glass -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  <g fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="miter">
    <!-- Shattered fragments across face -->

    <!-- Hair shards -->
    <polygon points="100,35 78,42 85,55 100,48"/>
    <polygon points="100,35 122,42 115,55 100,48"/>
    <polygon points="78,42 60,55 70,65 85,55"/>
    <polygon points="122,42 140,55 130,65 115,55"/>
    <polygon points="60,55 52,75 65,78 70,65"/>
    <polygon points="140,55 148,75 135,78 130,65"/>

    <!-- Forehead fragments -->
    <polygon points="85,55 70,65 75,80 95,72 100,48"/>
    <polygon points="115,55 130,65 125,80 105,72 100,48"/>
    <polygon points="95,72 75,80 80,88 100,82"/>
    <polygon points="105,72 125,80 120,88 100,82"/>

    <!-- Eye region shards -->
    <polygon points="65,78 52,95 60,105 72,95 75,80"/>
    <polygon points="135,78 148,95 140,105 128,95 125,80"/>
    <polygon points="75,80 72,95 88,100 92,85"/>
    <polygon points="125,80 128,95 112,100 108,85"/>

    <!-- Eyes - bold -->
    <polygon points="72,88 88,88 85,100 75,100" stroke-width="2"/>
    <polygon points="128,88 112,88 115,100 125,100" stroke-width="2"/>
    <polygon points="78,92 84,92 82,98 76,98" fill="#fff"/>
    <polygon points="122,92 116,92 118,98 124,98" fill="#fff"/>

    <!-- Nose shards -->
    <polygon points="92,85 88,100 95,115 100,100"/>
    <polygon points="108,85 112,100 105,115 100,100"/>
    <polygon points="95,115 100,100 105,115 100,120"/>

    <!-- Cheek fragments -->
    <polygon points="52,95 50,120 62,125 60,105"/>
    <polygon points="148,95 150,120 138,125 140,105"/>
    <polygon points="60,105 62,125 78,130 72,108"/>
    <polygon points="140,105 138,125 122,130 128,108"/>

    <!-- Mustache/mouth shards -->
    <polygon points="78,115 72,108 78,130 90,125"/>
    <polygon points="122,115 128,108 122,130 110,125"/>
    <polygon points="90,125 78,130 85,142 100,135"/>
    <polygon points="110,125 122,130 115,142 100,135"/>
    <polygon points="95,115 90,125 100,135 105,115"/>
    <polygon points="100,135 105,115 110,125"/>

    <!-- Beard fragments -->
    <polygon points="62,125 55,145 70,155 78,140 78,130" opacity="0.5"/>
    <polygon points="138,125 145,145 130,155 122,140 122,130" opacity="0.5"/>
    <polygon points="78,140 70,155 88,165 95,150 85,142" opacity="0.4"/>
    <polygon points="122,140 130,155 112,165 105,150 115,142" opacity="0.4"/>
    <polygon points="95,150 88,165 100,172 112,165 105,150 100,140" opacity="0.35"/>

    <!-- Jaw line fragments -->
    <polygon points="55,145 52,165 70,168 70,155" stroke-width="1.5"/>
    <polygon points="145,145 148,165 130,168 130,155" stroke-width="1.5"/>
    <polygon points="70,168 88,175 88,165 70,155" stroke-width="1.5"/>
    <polygon points="130,168 112,175 112,165 130,155" stroke-width="1.5"/>
    <polygon points="88,175 100,180 112,175 112,165 100,172 88,165" stroke-width="1.5"/>
  </g>
</svg>
