<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Abstract style E: Chaotic/expressive lines -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">

    <!-- Explosive hair lines -->
    <path d="M100 35 Q95 25 90 40 Q85 30 82 45" stroke-width="1.2"/>
    <path d="M100 35 Q105 22 110 38 Q118 28 120 45" stroke-width="1.2"/>
    <path d="M70 50 Q60 35 55 55 Q48 45 50 65" stroke-width="1"/>
    <path d="M130 50 Q140 35 145 55 Q152 45 150 65" stroke-width="1"/>
    <path d="M60 60 Q50 50 48 72" stroke-width="0.8"/>
    <path d="M140 60 Q150 50 152 72" stroke-width="0.8"/>

    <!-- Chaotic face outline - multiple overlapping strokes -->
    <path d="M52 90 Q50 55 100 48 Q150 55 148 90" stroke-width="1.5"/>
    <path d="M55 92 Q52 58 100 50 Q148 58 145 92" stroke-width="0.8" opacity="0.5"/>
    <path d="M148 95 Q150 135 125 158 Q100 178 75 158 Q50 135 52 95" stroke-width="1.5"/>
    <path d="M145 98 Q148 132 122 155 Q100 172 78 155 Q52 132 55 98" stroke-width="0.8" opacity="0.5"/>

    <!-- Energetic eyebrows -->
    <path d="M62 78 Q72 68 85 75 Q92 78 95 82" stroke-width="2"/>
    <path d="M65 76 Q78 70 90 78" stroke-width="1" opacity="0.6"/>
    <path d="M138 78 Q128 68 115 75 Q108 78 105 82" stroke-width="2"/>
    <path d="M135 76 Q122 70 110 78" stroke-width="1" opacity="0.6"/>

    <!-- Eyes - scribbled circles -->
    <circle cx="78" cy="92" r="10" stroke-width="1.5"/>
    <circle cx="78" cy="92" r="8" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="78" cy="93" rx="11" ry="9" stroke-width="0.6" opacity="0.3"/>
    <circle cx="122" cy="92" r="10" stroke-width="1.5"/>
    <circle cx="122" cy="92" r="8" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="122" cy="93" rx="11" ry="9" stroke-width="0.6" opacity="0.3"/>
    <!-- Pupils -->
    <circle cx="78" cy="93" r="3" fill="#fff"/>
    <circle cx="122" cy="93" r="3" fill="#fff"/>

    <!-- Nose - gestural -->
    <path d="M100 82 L96 105 Q98 115 100 118 Q102 115 104 105" stroke-width="1.5"/>
    <path d="M98 85 L95 102" stroke-width="0.8" opacity="0.5"/>
    <path d="M102 85 L105 102" stroke-width="0.8" opacity="0.5"/>

    <!-- Mustache - quick strokes -->
    <path d="M80 118 Q88 125 100 122 Q112 125 120 118" stroke-width="1.8"/>
    <path d="M82 120 Q92 126 100 124" stroke-width="1" opacity="0.6"/>
    <path d="M100 124 Q108 126 118 120" stroke-width="1" opacity="0.6"/>

    <!-- Mouth - expressive -->
    <path d="M85 135 Q100 148 115 135" stroke-width="2"/>
    <path d="M88 137 Q100 145 112 137" stroke-width="1" opacity="0.5"/>

    <!-- Beard - wild strokes -->
    <path d="M58 125 Q48 150 72 168" stroke-width="1" opacity="0.5"/>
    <path d="M62 128 Q55 152 78 165" stroke-width="0.8" opacity="0.4"/>
    <path d="M65 130 Q60 150 82 162" stroke-width="0.6" opacity="0.3"/>
    <path d="M142 125 Q152 150 128 168" stroke-width="1" opacity="0.5"/>
    <path d="M138 128 Q145 152 122 165" stroke-width="0.8" opacity="0.4"/>
    <path d="M135 130 Q140 150 118 162" stroke-width="0.6" opacity="0.3"/>
    <path d="M78 165 Q100 180 122 165" stroke-width="0.8" opacity="0.4"/>
    <path d="M85 162 Q100 175 115 162" stroke-width="0.6" opacity="0.3"/>

    <!-- Accent splatters -->
    <circle cx="35" cy="70" r="2" fill="#fff" opacity="0.3"/>
    <circle cx="165" cy="130" r="1.5" fill="#fff" opacity="0.25"/>
    <circle cx="40" cy="140" r="1" fill="#fff" opacity="0.2"/>
    <circle cx="160" cy="60" r="1.5" fill="#fff" opacity="0.2"/>
  </g>
</svg>
