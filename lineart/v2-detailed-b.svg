<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Detailed style B: High contrast, dramatic shadows -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Face - bold outline -->
    <path d="M55 90 Q55 52 100 48 Q145 52 145 90 Q145 125 130 148 Q112 168 100 168 Q88 168 70 148 Q55 125 55 90" stroke-width="3"/>

    <!-- Strong shadow on right side of face -->
    <path d="M125 60 Q145 80 145 100 Q145 130 130 150" stroke-width="8" opacity="0.15"/>
    <path d="M130 65 Q142 85 142 105 Q142 130 128 148" stroke-width="4" opacity="0.2"/>

    <!-- Hair - dramatic -->
    <path d="M55 85 Q52 38 100 32 Q148 38 145 85" stroke-width="4"/>
    <path d="M65 58 Q85 42 100 45 Q115 42 135 58" stroke-width="2.5"/>
    <!-- Hair fill suggestion -->
    <path d="M60 78 L65 55" stroke-width="2"/>
    <path d="M70 72 L78 48" stroke-width="2"/>
    <path d="M85 68 L92 45" stroke-width="1.5"/>
    <path d="M100 65 L100 44" stroke-width="1.5"/>
    <path d="M115 68 L108 45" stroke-width="1.5"/>
    <path d="M130 72 L122 48" stroke-width="2"/>
    <path d="M140 78 L135 55" stroke-width="2"/>

    <!-- Eyebrows - thick and bold -->
    <path d="M65 80 Q78 72 95 80" stroke-width="4"/>
    <path d="M105 80 Q122 72 135 80" stroke-width="4"/>

    <!-- Eyes - intense -->
    <ellipse cx="80" cy="95" rx="11" ry="9" stroke-width="2"/>
    <ellipse cx="120" cy="95" rx="11" ry="9" stroke-width="2"/>
    <!-- Heavy upper lid -->
    <path d="M69 92 Q80 86 91 92" stroke-width="2.5"/>
    <path d="M109 92 Q120 86 131 92" stroke-width="2.5"/>
    <!-- Iris and pupil -->
    <circle cx="80" cy="96" r="6" stroke-width="1.5"/>
    <circle cx="120" cy="96" r="6" stroke-width="1.5"/>
    <circle cx="80" cy="96" r="3" fill="#fff"/>
    <circle cx="120" cy="96" r="3" fill="#fff"/>

    <!-- Nose - defined -->
    <path d="M100 85 L96 108" stroke-width="2"/>
    <path d="M96 108 Q92 116 90 112" stroke-width="1.5"/>
    <path d="M96 108 Q100 118 104 108" stroke-width="2"/>
    <path d="M104 108 Q108 116 110 112" stroke-width="1.5"/>
    <!-- Nose shadow -->
    <path d="M94 90 L92 105" stroke-width="1.5" opacity="0.4"/>

    <!-- Mustache - bold -->
    <path d="M82 120 Q92 128 100 125 Q108 128 118 120" stroke-width="3"/>

    <!-- Mouth -->
    <path d="M86 136 Q100 144 114 136" stroke-width="2.5"/>

    <!-- Beard - heavy shadow -->
    <path d="M62 125 Q56 150 75 165 Q92 178 100 175 Q108 178 125 165 Q144 150 138 125" stroke-width="2" opacity="0.5"/>
    <path d="M68 130 Q64 152 80 163" stroke-width="1.5" opacity="0.35"/>
    <path d="M132 130 Q136 152 120 163" stroke-width="1.5" opacity="0.35"/>
    <path d="M75 155 Q88 168 100 166 Q112 168 125 155" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
