<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Geometric style A: Low-poly triangulated -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="miter">
    <!-- Face triangulated mesh -->
    <polygon points="100,50 60,70 70,55"/>
    <polygon points="100,50 70,55 100,45"/>
    <polygon points="100,50 100,45 130,55"/>
    <polygon points="100,50 130,55 140,70"/>

    <polygon points="60,70 52,95 70,85"/>
    <polygon points="60,70 70,85 100,50"/>
    <polygon points="140,70 130,85 148,95"/>
    <polygon points="140,70 100,50 130,85"/>

    <polygon points="52,95 55,120 70,100"/>
    <polygon points="70,100 70,85 52,95"/>
    <polygon points="148,95 145,120 130,100"/>
    <polygon points="130,100 130,85 148,95"/>

    <polygon points="70,85 80,95 100,75"/>
    <polygon points="100,75 100,50 70,85"/>
    <polygon points="130,85 120,95 100,75"/>
    <polygon points="100,75 100,50 130,85"/>

    <polygon points="70,100 80,95 80,110"/>
    <polygon points="80,110 55,120 70,100"/>
    <polygon points="130,100 120,95 120,110"/>
    <polygon points="120,110 145,120 130,100"/>

    <polygon points="80,95 100,75 100,95"/>
    <polygon points="100,95 120,95 100,75"/>

    <polygon points="80,95 100,95 90,115"/>
    <polygon points="100,95 120,95 110,115"/>
    <polygon points="90,115 100,110 80,110"/>
    <polygon points="110,115 100,110 120,110"/>
    <polygon points="90,115 100,110 110,115"/>

    <polygon points="80,110 90,115 85,130"/>
    <polygon points="120,110 110,115 115,130"/>
    <polygon points="85,130 100,125 90,115"/>
    <polygon points="115,130 100,125 110,115"/>
    <polygon points="90,115 100,125 110,115"/>

    <polygon points="55,120 70,145 85,130"/>
    <polygon points="85,130 80,110 55,120"/>
    <polygon points="145,120 130,145 115,130"/>
    <polygon points="115,130 120,110 145,120"/>

    <polygon points="85,130 100,140 70,145"/>
    <polygon points="115,130 100,140 130,145"/>
    <polygon points="85,130 100,125 100,140"/>
    <polygon points="115,130 100,125 100,140"/>

    <polygon points="70,145 85,160 100,155"/>
    <polygon points="100,155 100,140 70,145"/>
    <polygon points="130,145 115,160 100,155"/>
    <polygon points="100,155 100,140 130,145"/>

    <polygon points="85,160 100,168 100,155"/>
    <polygon points="115,160 100,168 100,155"/>

    <!-- Eyes - triangulated -->
    <polygon points="75,90 85,90 80,98" fill="#fff"/>
    <polygon points="115,90 125,90 120,98" fill="#fff"/>
  </g>
</svg>
