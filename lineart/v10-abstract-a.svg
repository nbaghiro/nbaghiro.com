<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Abstract style A: Spiral/circular focus -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Spiral forming face outline -->
    <path d="M100,30
             Q150,30 160,80
             Q170,130 130,160
             Q100,180 70,160
             Q30,130 40,80
             Q50,40 100,50
             Q140,55 145,90
             Q150,130 115,150
             Q100,160 85,150
             Q50,130 60,90
             Q65,60 100,65" stroke-width="1.5"/>

    <!-- Hair - radiating arcs -->
    <path d="M60,70 Q100,25 140,70" stroke-width="2"/>
    <path d="M65,65 Q100,30 135,65" stroke-width="1.5" opacity="0.7"/>
    <path d="M70,60 Q100,35 130,60" stroke-width="1" opacity="0.5"/>

    <!-- Concentric eye circles - left -->
    <circle cx="78" cy="90" r="18" stroke-width="0.8" opacity="0.3"/>
    <circle cx="78" cy="90" r="14" stroke-width="1" opacity="0.5"/>
    <circle cx="78" cy="90" r="10" stroke-width="1.2" opacity="0.7"/>
    <circle cx="78" cy="90" r="6" stroke-width="1.5"/>
    <circle cx="78" cy="90" r="2.5" fill="#fff"/>

    <!-- Concentric eye circles - right -->
    <circle cx="122" cy="90" r="18" stroke-width="0.8" opacity="0.3"/>
    <circle cx="122" cy="90" r="14" stroke-width="1" opacity="0.5"/>
    <circle cx="122" cy="90" r="10" stroke-width="1.2" opacity="0.7"/>
    <circle cx="122" cy="90" r="6" stroke-width="1.5"/>
    <circle cx="122" cy="90" r="2.5" fill="#fff"/>

    <!-- Eyebrows as arcs -->
    <path d="M60,75 Q78,65 96,75" stroke-width="2"/>
    <path d="M104,75 Q122,65 140,75" stroke-width="2"/>

    <!-- Nose - spiral hint -->
    <path d="M100,85 Q95,100 98,110 Q100,115 102,110 Q105,100 100,95" stroke-width="1.5"/>

    <!-- Mouth - concentric curves -->
    <path d="M80,135 Q100,150 120,135" stroke-width="1" opacity="0.4"/>
    <path d="M85,133 Q100,145 115,133" stroke-width="1.2" opacity="0.6"/>
    <path d="M90,131 Q100,140 110,131" stroke-width="1.5"/>

    <!-- Beard - radiating curves -->
    <path d="M60,120 Q50,150 80,170" stroke-width="1" opacity="0.4"/>
    <path d="M65,125 Q58,152 85,168" stroke-width="0.8" opacity="0.3"/>
    <path d="M140,120 Q150,150 120,170" stroke-width="1" opacity="0.4"/>
    <path d="M135,125 Q142,152 115,168" stroke-width="0.8" opacity="0.3"/>
    <path d="M80,170 Q100,180 120,170" stroke-width="1" opacity="0.35"/>

    <!-- Decorative spiral accent -->
    <path d="M170,50 Q175,60 170,70 Q165,75 160,70 Q158,65 162,62" stroke-width="0.8" opacity="0.3"/>
    <path d="M30,150 Q25,160 30,170 Q35,175 40,170 Q42,165 38,162" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>
