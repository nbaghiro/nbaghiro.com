# Render Blueprint for nbaghiro.com. One web service (Node) runs Express, which serves the built
# React app AND /api on one origin. A Key Value instance holds the project chat's daily spend and
# per-visitor counters, so they survive the free web instance sleeping and restarting.
services:
    - type: web
      name: nbaghiro
      runtime: node
      region: oregon
      plan: starter # always on. Free spun down after 15 idle minutes and showed Render's
      # waking-up page on the next visit, which is the first thing a phone saw at /ads.
      branch: main
      # Deploy each push to main. This was `checksPass`, which waits for the GitHub checks
      # (.github/workflows/ci.yml), and Render repeatedly never created the deploy at all:
      # CI green, commit on origin, no deploy and no failed attempt to retry. It happened on
      # 2026-10-19, again on 2026-10-29, and four pushes running on 2026-11-20, each one
      # needing `render deploys create` by hand. A missed webhook under checksPass is
      # invisible from outside, since the site keeps answering 200 with the previous build.
      # Every other service in this account is on `commit` and deploys reliably. A build that
      # would have failed CI now reaches Render, where it fails the build instead and leaves
      # the running version up.
      autoDeployTrigger: commit
      # `--include=dev`: NODE_ENV=production below makes `npm ci` skip devDependencies, and the
      # client build needs vite from there.
      # Node version comes from "engines" in the root package.json (24.x).
      buildCommand: npm ci --include=dev && npm run build
      startCommand: npm start
      healthCheckPath: /api/health
      envVars:
          - key: NODE_ENV
            value: production
          - key: CHAT_DAILY_CAP_USD # hard stop for the project chat's Claude spend, per UTC day
            value: "5"
          - key: CHAT_QUESTIONS_PER_VISITOR
            value: "10"
          - key: REDIS_URL
            fromService:
                type: keyvalue
                name: nbaghiro-kv
                property: connectionString
          # --- secrets: set in the Render dashboard (never committed) ---
          - key: ANTHROPIC_API_KEY
            sync: false
          # optional: a fine-grained token with no permissions raises the GitHub API limit the
          # chat's live commit history runs under from 60 to 5,000 requests an hour
          - key: GITHUB_TOKEN
            sync: false

    - type: keyvalue
      name: nbaghiro-kv
      region: oregon
      plan: free # in-memory only: a Key Value restart resets the day's counters
      maxmemoryPolicy: noeviction
      ipAllowList: [] # reachable only from services in this Render account
